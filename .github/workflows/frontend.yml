name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/frontend/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --workspace apps/frontend
      - run: npm run test --workspace apps/frontend
      - run: npm run build --workspace apps/frontend
