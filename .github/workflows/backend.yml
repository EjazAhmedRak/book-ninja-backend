name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src

      - name: Test + Coverage
        env:
          OPENAI_API_KEY: test-key
          TAVILY_API_KEY: test-key
          HARDCOVER_API_KEY: test-key
          MONGO_URI: mongodb://localhost:27017/book_ninja_test
          LANGSMITH_API_KEY: test-key
          GOOGLE_CLIENT_ID: test-client-id
          LANGCHAIN_TRACING_V2: "false"
          LANGCHAIN_PROJECT: book-ninja-test
        run: pytest --cov=src --cov-fail-under=80

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t book-ninja-backend:${{ github.sha }} .

      # Uncomment and configure when registry is chosen (ECR or Artifact Registry)
